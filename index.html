<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Therapedic OS | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/30 rounded-full blur-[128px]"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-[128px]"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="glass-card rounded-3xl p-8 sm:p-10 shadow-2xl">
      <div class="text-center mb-9">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 p-0.5 shadow-lg mb-4">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
            <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white">Therapedic <span class="text-indigo-500 font-normal">OS</span></h1>
        <p class="text-slate-400 text-sm mt-2">Portal de Indicadores (KPIs) & Mesa de Ayuda</p>
      </div>

      <form id="loginForm" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">Correo Institucional</label>
          <input type="email" id="usuario" required placeholder="correo@therapedic.com.mx" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-2">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500 text-sm">
        </div>
        <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">Acceder al Sistema</button>
      </form>

      <div id="mensaje" class="mt-4 text-center text-sm font-medium min-h-[20px]"></div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value.trim();
      const mensaje = document.getElementById('mensaje');

      mensaje.className = 'mt-4 text-center text-sm text-indigo-400 animate-pulse';
      mensaje.innerText = 'Autenticando credenciales...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();

        if (res.ok && data.ok) {
          localStorage.setItem('usuarioDaker', data.usuario.NombreCompleto);
          localStorage.setItem('emailDaker', data.usuario.Email);
          localStorage.setItem('rolDaker', data.usuario.NombreRol || 'Usuario');
          localStorage.setItem('idRolDaker', data.usuario.IdRol);
          localStorage.setItem('modulokpiDaker', data.usuario.modulokpi ? 1 : 0);
          localStorage.setItem('kpiTicketDaker', data.usuario.kpiTicket ? 1 : 0);

          mensaje.className = 'mt-4 text-center text-sm text-emerald-400 font-bold';
          mensaje.innerText = '¡Bienvenido! Redirigiendo al sistema...';
          
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          mensaje.className = 'mt-4 text-center text-sm text-rose-400 font-bold';
          mensaje.innerText = data.mensaje || 'Usuario o contraseña incorrectos.';
        }
      } catch (err) {
        console.error('Error al intentar acceder:', err);
        mensaje.className = 'mt-4 text-center text-sm text-rose-400 font-bold';
        mensaje.innerText = 'Error de comunicación con el servidor. Verifica que el backend esté activo.';
      }
    });
  </script>
</body>
</html>
